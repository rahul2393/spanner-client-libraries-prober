apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spanner-ns
  name: irahul-java-dcp-workload1-step-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irahul-java-dcp-workload1-step-up
  template:
    metadata:
      labels:
        app: irahul-java-dcp-workload1-step-up
    spec:
      containers:
        - name: workload1-step-up
          # Build with: ./java/probers/scripts/build-images.sh source <dcp-branch> --push
          image: us-central1-docker.pkg.dev/span-cloud-testing/irahul-images/irahul-client:dcp
          imagePullPolicy: Always
          ports:
            - name: jmx
              containerPort: 5000
              protocol: TCP
            - name: jdwp
              containerPort: 5005
              protocol: TCP
          command: ["java"]
          args:
            - -XX:-TieredCompilation
            - -XX:CompileThreshold=1000
            - -jar
            - /app/main.jar
          resources:
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "2Gi"
              cpu: "4"
          env:
            - name: PROBE_TYPE
              value: "stale_query"
            - name: START_QPS
              value: "100"
            - name: END_QPS
              value: "5000"
            - name: STEP_QPS_PERCENT
              value: "25"
            - name: QPS_STEP_INTERVAL_SECONDS
              value: "60"
            - name: MAX_INFLIGHT
              value: "512"
            - name: ENABLE_DYNAMIC_CHANNEL_POOL
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "irahul-java-dcp-workload1-step-up"
#            - name: GOOGLE_SPANNER_ENABLE_DIRECT_ACCESS
#              value: "true"
#            - name: ENABLE_DEBUG_LOGGING
#              value: "true"
#            - name: JAVA_TOOL_OPTIONS
#              value: "-XX:+AlwaysPreTouch -XX:+UseG1GC -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=5000 -Dcom.sun.management.jmxremote.rmi.port=5000 -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1"
