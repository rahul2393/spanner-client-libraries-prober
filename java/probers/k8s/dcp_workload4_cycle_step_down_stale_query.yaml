apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spanner-ns
  name: irahul-java-dcp-workload4-cycle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irahul-java-dcp-workload4-cycle
  template:
    metadata:
      labels:
        app: irahul-java-dcp-workload4-cycle
    spec:
      containers:
        - name: workload4-cycle-step-down
          # Build with: ./java/probers/scripts/build-images.sh source <dcp-branch> --push
          image: us-central1-docker.pkg.dev/span-cloud-testing/irahul-images/irahul-client:dcp
          imagePullPolicy: Always
          ports:
            - name: jmx
              containerPort: 5000
              protocol: TCP
            - name: jdwp
              containerPort: 5005
              protocol: TCP
          command: ["java"]
          args:
            - -XX:-TieredCompilation
            - -XX:CompileThreshold=1000
            - -jar
            - /app/main.jar
          resources:
            requests:
              memory: "2Gi"
              cpu: "4"
            limits:
              memory: "4Gi"
              cpu: "8"
          env:
            - name: PROBE_TYPE
              value: "stale_query"
            - name: FIXED_KEY
              value: "12345"
            - name: LOAD_MODE
              value: "concurrency"
            - name: START_LOAD
              value: "50"
            - name: END_LOAD
              value: "600"
            - name: STEP_LOAD_PERCENT
              value: "50"
            - name: LOAD_STEP_INTERVAL_SECONDS
              value: "180"
            - name: LOAD_CYCLE_ENABLED
              value: "true"
            - name: LOW_LOAD_HOLD_SECONDS
              value: "600"
            - name: MAX_INFLIGHT
              value: "600"
            - name: ENABLE_DYNAMIC_CHANNEL_POOL
              value: "true"
            - name: SPANNER_ENABLE_OTEL_METRICS
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "irahul-java-dcp-workload4-cycle"
            - name: OTEL_TRACE_SAMPLING_FRACTION
              value: "0"
#            - name: GOOGLE_SPANNER_ENABLE_DIRECT_ACCESS
#              value: "true"
#            - name: ENABLE_DEBUG_LOGGING
#              value: "true"
#            - name: JAVA_TOOL_OPTIONS
#              value: "-XX:+AlwaysPreTouch -XX:+UseG1GC -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=5000 -Dcom.sun.management.jmxremote.rmi.port=5000 -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1"
