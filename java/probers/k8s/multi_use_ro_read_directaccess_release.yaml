apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spanner-ns
  name: irahul-muro-read-directaccess-release
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irahul-muro-read-directaccess-release
  template:
    metadata:
      labels:
        app: irahul-muro-read-directaccess-release
    spec:
      containers:
        - name: multi-use-ro-read-release
          image: us-central1-docker.pkg.dev/span-cloud-testing/irahul-images/irahul-client:release-6.118.0-SNAPSHOT
          imagePullPolicy: Always
          command: ["java"]
          args:
            - -XX:-TieredCompilation
            - -XX:CompileThreshold=1000
            - -jar
            - /app/main.jar
          resources:
            requests:
              memory: "400Mi"
              cpu: "0.4"
            limits:
              memory: "400Mi"
              cpu: "0.4"
          env:
            - name: PROBE_TYPE
              value: "multi_use_ro_read"
            - name: QPS
              value: "10"
            - name: OTEL_SERVICE_NAME
              value: "irahul-muro-read-directaccess-release"
            - name: OTEL_TRACE_SAMPLING_FRACTION
              value: "0"
            - name: GOOGLE_SPANNER_ENABLE_DIRECT_ACCESS
              value: "true"
