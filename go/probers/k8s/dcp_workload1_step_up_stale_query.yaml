apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spanner-ns
  name: irahul-go-dcp-workload1-step-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irahul-go-dcp-workload1-step-up
  template:
    metadata:
      labels:
        app: irahul-go-dcp-workload1-step-up
    spec:
      containers:
        - name: workload1-step-up
          # Build with: ./go/probers/scripts/build-images.sh source <dcp-branch> --push
          image: us-central1-docker.pkg.dev/span-cloud-testing/irahul-images/irahul-go-client:dcp
          imagePullPolicy: Always
          ports:
            - name: pprof
              containerPort: 6060
              protocol: TCP
          resources:
            requests:
              memory: "2Gi"
              cpu: "4"
            limits:
              memory: "4Gi"
          env:
            - name: PROBE_TYPE
              value: "stale_query"
            - name: FIXED_KEY
              value: "12345"
            - name: LOAD_MODE
              value: "concurrency"
            - name: LOAD_STEPS
              value: "10,50,100,200,300,400,500,400,300,200,100,50,10"
            - name: LOAD_STEP_INTERVAL_SECONDS
              value: "180"
            - name: STEP_WARMUP_DISCARD_SECONDS
              value: "60"
            - name: MAX_INFLIGHT
              value: "500"
            - name: SPANNER_DCP_ENABLED
              value: "true"
            - name: SPANNER_DCP_INITIAL_CHANNELS
              value: "4"
            - name: SPANNER_DCP_MIN_CHANNELS
              value: "4"
            - name: SPANNER_DCP_MAX_CHANNELS
              value: "256"
            - name: SPANNER_DCP_MAX_RPC_PER_CHANNEL
              value: "50"
            - name: SPANNER_DCP_MIN_RPC_PER_CHANNEL
              value: "5"
            - name: SPANNER_DCP_LOAD_LOG_INTERVAL_SECONDS
              value: "10"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_PROJECT_ID
              value: "span-cloud-testing"
            - name: OTEL_SERVICE_NAME
              value: "irahul-go-dcp-workload1-step-up"
            - name: OTEL_TRACE_SAMPLING_FRACTION
              value: "0"
            - name: OTEL_METRIC_PREFIX
              value: "custom.googleapis.com/irahul"
            - name: OTEL_METRIC_EXPORT_INTERVAL_SECONDS
              value: "10"
            - name: OTEL_EXPORT_DEBUG
              value: "false"
#            - name: GOOGLE_SPANNER_ENABLE_DIRECT_ACCESS
#              value: "true"
#            - name: GOOGLE_SPANNER_ENABLE_GCP_FALLBACK
#              value: "true"
#            - name: PPROF_ENABLED
#              value: "true"
#            - name: PPROF_ADDR
#              value: ":6060"
