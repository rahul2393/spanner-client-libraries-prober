apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: spanner-ns
  name: irahul-go-dcp-workload4-cycle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irahul-go-dcp-workload4-cycle
  template:
    metadata:
      labels:
        app: irahul-go-dcp-workload4-cycle
    spec:
      containers:
        - name: workload4-cycle-step-down
          # Build with: ./go/probers/scripts/build-images.sh source <dcp-branch> --push
          image: us-central1-docker.pkg.dev/span-cloud-testing/irahul-images/irahul-go-client:support-dynamic-channel-pooling
          imagePullPolicy: Always
          ports:
            - name: pprof
              containerPort: 6060
              protocol: TCP
          resources:
            requests:
              memory: "2Gi"
              cpu: "4"
            limits:
              memory: "4Gi"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROBE_TYPE
              value: "stale_query"
            - name: FIXED_KEY
              value: "12345"
            - name: LOAD_MODE
              value: "concurrency"
            - name: START_LOAD
              value: "1"
            - name: END_LOAD
              value: "200"
            - name: STEP_LOAD_PERCENT
              value: "50"
            - name: LOAD_STEP_INTERVAL_SECONDS
              value: "30"
            - name: LOAD_CYCLE_ENABLED
              value: "true"
            - name: LOW_LOAD_HOLD_SECONDS
              value: "300"
            - name: MAX_INFLIGHT
              value: "300"
            - name: SPANNER_DCP_ENABLED
              value: "true"
            - name: SPANNER_DCP_INITIAL_CHANNELS
              value: "1"
            - name: SPANNER_DCP_MIN_CHANNELS
              value: "1"
            - name: SPANNER_DCP_MAX_CHANNELS
              value: "200"
            - name: SPANNER_DCP_MAX_RPC_PER_CHANNEL
              value: "10"
            - name: SPANNER_DCP_MIN_RPC_PER_CHANNEL
              value: "2"
            - name: SPANNER_DCP_DEBUG_LOGS
              value: "true"
            - name: OTEL_ENABLED
              value: "false"
            - name: OTEL_PROJECT_ID
              value: "span-cloud-testing"
            - name: OTEL_SERVICE_NAME
              value: "irahul-go-dcp-workload4-cycle"
            - name: OTEL_TRACE_SAMPLING_FRACTION
              value: "0"
            - name: OTEL_METRIC_PREFIX
              value: "custom.googleapis.com/irahul"
            - name: OTEL_METRIC_EXPORT_INTERVAL_SECONDS
              value: "10"
            - name: OTEL_EXPORT_DEBUG
              value: "false"
            - name: OTEL_RESOURCE_LOCATION
              value: "global"
            # DCP custom metric types emitted by this workload:
            # - custom.googleapis.com/irahul/spanner/dcp/active_channel_count
            # - custom.googleapis.com/irahul/spanner/dcp/draining_channel_count
            # - custom.googleapis.com/irahul/spanner/dcp/channel_stream_load
            # - custom.googleapis.com/irahul/spanner/dcp/channel_operation_refs
            # - custom.googleapis.com/irahul/spanner/dcp/selection_count
            # - custom.googleapis.com/irahul/spanner/dcp/scale_up_count
            # - custom.googleapis.com/irahul/spanner/dcp/scale_up_added_channels
            # - custom.googleapis.com/irahul/spanner/dcp/scale_down_count
#            - name: GOOGLE_SPANNER_ENABLE_DIRECT_ACCESS
#              value: "true"
#            - name: GOOGLE_SPANNER_ENABLE_GCP_FALLBACK
#              value: "true"
            - name: PPROF_ENABLED
              value: "true"
            - name: PPROF_ADDR
              value: ":6060"
            - name: PPROF_MUTEX_PROFILE_FRACTION
              value: "5"
            - name: PPROF_BLOCK_PROFILE_RATE
              value: "1000000"
